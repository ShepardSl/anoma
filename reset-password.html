<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Сброс пароля — ANOMA</title>
  <meta name="description" content="Установка нового пароля для аккаунта ANOMA.">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" href="./assets/img/favicon.ico" sizes="any">
  <link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body class="page-reset">

  <header class="header header--visible" id="header">
    <div class="container header__inner" style="justify-content: center;">
      <a href="index.html" class="header__logo-link" aria-label="На главную">
        <img src="./assets/img/logo.png" alt="ANOMA Logo" class="header__logo">
      </a>
    </div>
  </header>

  <main class="main" style="min-height: calc(100vh - 180px); display: flex; align-items: center; justify-content: center; padding: 20px;">
    
    <div class="auth-modal__content" id="resetPasswordContainer" style="box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);">
      
      <!-- Экран установки нового пароля -->
      <div class="auth-modal__screen is-active" data-screen="resetPassword">
        <h2 class="auth-modal__title">Новый пароль</h2>
        <form class="auth-form" id="resetForm" novalidate>
          <div class="auth-form__group">
            <input type="password" name="newPassword" class="auth-input" placeholder="Новый пароль" required>
            <span class="auth-error-msg">Введите пароль</span>
          </div>
          <div class="auth-form__group">
            <input type="password" name="confirmPassword" class="auth-input" placeholder="Повторите пароль" required>
            <span class="auth-error-msg">Пароли не совпадают</span>
          </div>
          <button type="submit" class="auth-btn auth-btn--primary">СОХРАНИТЬ ПАРОЛЬ</button>
        </form>
      </div>

      <!-- Экран успеха смены пароля -->
      <div class="auth-modal__screen" data-screen="resetPasswordSuccess">
        <h2 class="auth-modal__title">Пароль изменён</h2>
        <p class="auth-modal__desc">Пароль изменён. Теперь вы можете войти в аккаунт.</p>
        <a href="index.html" class="auth-btn auth-btn--primary" style="text-decoration: none; text-align: center;">На главную</a>
      </div>

    </div>

  </main>

  <script src="./assets/js/main.js"></script>
</body>

</html>
